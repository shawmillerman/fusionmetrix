<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message Sent | FusionMetrix</title>
  <meta name="robots" content="noindex" />
  <style>
    :root {
      --bg-paper: #f4f1ea;        /* Warm Ivory Background */
      --text-main: #191c1a;       /* Charcoal Structure */
      --brand-green: #1b382b;     /* PSU-inspired Forest Green */
      --accent-lime: #c3f235;     /* Charged Rebel Accent */
      --border-dark: #000000;     /* Hard Neo-brutalist Border */
      --card-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-paper);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 2rem 1rem;
      line-height: 1.6;
    }

    .container { max-width: 900px; margin: 0 auto; }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1.5rem;
      border-bottom: 2px solid var(--border-dark);
      margin-bottom: 2.5rem;
    }

    .logo {
      font-weight: 900;
      font-size: 1.25rem;
      letter-spacing: -0.03em;
      color: var(--brand-green);
      text-transform: uppercase;
    }

    .nav-links { display: flex; gap: 0.75rem; }

    .nav-link {
      font-family: monospace;
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--border-dark);
      background-color: var(--bg-paper);
      padding: 0.25rem 0.75rem;
      border: 1.5px solid var(--border-dark);
      border-radius: 4px;
      text-decoration: none;
    }

    .nav-link.active { background-color: var(--accent-lime); }

    .tag {
      font-family: monospace;
      font-weight: bold;
      color: var(--brand-green);
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
      display: inline-block;
    }

    .hero-card {
      background-color: var(--bg-paper);
      border: 3px solid var(--border-dark);
      box-shadow: 6px 6px 0px var(--border-dark);
      padding: 2.5rem;
      border-radius: 12px;
      margin-bottom: 3rem;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 1rem;
      color: var(--text-main);
    }

    footer {
      text-align: center;
      font-family: monospace;
      font-size: 0.85rem;
      color: #666;
      padding-top: 1rem;
      border-top: 1px solid #ccc;
    }

    p.subhead { font-size: 1.15rem; color: #333; margin-bottom: 2rem; }

    .contact-card {
      background-color: var(--card-bg);
      border: 2px solid var(--border-dark);
      box-shadow: 4px 4px 0px var(--border-dark);
      padding: 2rem;
      border-radius: 8px;
      margin-bottom: 3rem;
    }

    .field { margin-bottom: 1.25rem; }

    label {
      display: block;
      font-family: monospace;
      font-weight: bold;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--brand-green);
      margin-bottom: 0.4rem;
    }

    input, textarea {
      width: 100%;
      font-family: inherit;
      font-size: 1rem;
      color: var(--text-main);
      background-color: var(--bg-paper);
      border: 2px solid var(--border-dark);
      border-radius: 8px;
      padding: 0.7rem 0.9rem;
    }

    textarea { min-height: 10rem; resize: vertical; }

    input:focus, textarea:focus {
      outline: none;
      background-color: var(--card-bg);
      box-shadow: 3px 3px 0px var(--accent-lime), 3px 3px 0px 1px var(--border-dark);
    }

    .hidden { display: none; }

    .btn-submit {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      padding: 1rem 2.5rem;
      border-width: 3px;
      border-radius: 10px;
      box-shadow: 5px 5px 0px var(--border-dark);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .btn-submit:hover {
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0px var(--border-dark);
    }

    .btn-submit:active {
      transform: translate(5px, 5px);
      box-shadow: 0px 0px 0px var(--border-dark);
    }

    .btn-submit:focus-visible { outline: 3px solid var(--brand-green); outline-offset: 3px; }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <div class="logo">FusionMetrix</div>
      <div class="nav-links">
        <a href="/" class="nav-link">Home</a>
        <a href="/contact-new/" class="nav-link">Contact</a>
      </div>
    </nav>

    <div class="hero-card">
      <span class="tag">MESSAGE SENT &#10003;</span>
      <h1>Thanks &mdash; got it.</h1>
      <p class="subhead">I&rsquo;ll be in touch soon.</p>
      <div class="button-group">
        <a href="/" class="btn btn-primary">Back to Home</a>
      </div>
    </div>

    <footer>
      FusionMetrix &copy; 2026 &bull; Built with HTML/CSS on GitHub Pages
    </footer>
  </div>
</body>
</html>
